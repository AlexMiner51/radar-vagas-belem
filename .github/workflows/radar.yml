name: Radar diario

on:

  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

jobs:

  radar:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Teste Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python radar.py

      - name: Salvar his*órico
        run: |
          git*config user.name "github-actions"
*         git config user.email "gi*hub-actions@github.com"

         *git add seen.json

          git d*ff --staged --quiet || git commit *m "Atualiza histórico"

          *it push

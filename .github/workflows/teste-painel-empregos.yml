name: Teste Painel Empregos

on:
  workflow_dispatch:

jobs:

  teste:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Testar Painel de Empregos
        run: python teste_painel_empregos.py

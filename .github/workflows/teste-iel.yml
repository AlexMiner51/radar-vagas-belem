name: Teste IEL

on:
  workflow_dispatch:

jobs:

  teste:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Testar IEL
        run: python teste_iel.py
